<div class="col-12">
    <h5 class="mb-3"><i class="fa-solid fa-lock me-2"></i>{{ locale.t("settings-password-title") }}</h5>
    <div class="col-12 col-md-8 col-lg-6 mb-4">
        <form hx-post="/hx/settings/password" hx-target="#settings-result" hx-swap="innerHTML">
            <div class="mb-3">
                <label for="current_password" class="form-label">{{ locale.t("settings-password-current") }}</label>
                <input type="password" class="form-control" id="current_password" name="current_password" required>
            </div>
            <div class="mb-3">
                <label for="new_password" class="form-label">{{ locale.t("settings-password-new") }}</label>
                <input type="password" class="form-control" id="new_password" name="new_password" minlength="8" required>
            </div>
            <div class="mb-3">
                <label for="confirm_password" class="form-label">{{ locale.t("settings-password-confirm") }}</label>
                <input type="password" class="form-control" id="confirm_password" name="confirm_password" minlength="8" required>
            </div>
            <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk me-2"></i>{{ locale.t("settings-password-update") }}</button>
        </form>
        <div id="settings-result" class="mt-3"></div>
    </div>

    <hr class="my-4">

    <div hx-get="/hx/settings/2fa" hx-trigger="load">
        <span class="text-muted">{{ locale.t("settings-loading-auth") }}</span>
    </div>
</div>
