<div class="col-12 col-md-8 col-lg-6">
    <form hx-post="/hx/settings/language" hx-target="#language-result" hx-swap="innerHTML">
        <div class="mb-3">
            <label class="form-label fw-semibold">{{ locale.t("language-select-label") }}</label>
            <div class="d-flex flex-column gap-2 mt-2">

                <div class="form-check">
                    <input class="form-check-input" type="radio" name="language" id="lang-browser" value="browser"
                        {% if current_language == "browser" %}checked{% endif %}>
                    <label class="form-check-label" for="lang-browser">
                        <i class="fa-solid fa-globe me-2 text-secondary"></i>
                        <strong>{{ locale.t("language-browser-option") }}</strong>
                        <span class="text-secondary small ms-1">&mdash; {{ locale.t("language-browser-description") }}</span>
                    </label>
                </div>

                <hr class="my-1">

                {% for lang in available_langs %}
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="language"
                        id="lang-{{ lang.code }}" value="{{ lang.code }}"
                        {% if current_language == lang.code.as_str() %}checked{% endif %}>
                    <label class="form-check-label" for="lang-{{ lang.code }}">
                        <strong>{{ lang.name }}</strong>
                        <span class="text-secondary small ms-1">({{ lang.code }})</span>
                    </label>
                </div>
                {% endfor %}

            </div>
        </div>
        <button type="submit" class="btn btn-primary mt-1">
            <i class="fa-solid fa-floppy-disk me-2"></i>{{ locale.t("language-save-button") }}
        </button>
    </form>
    <div id="language-result" class="mt-3"></div>
</div>
