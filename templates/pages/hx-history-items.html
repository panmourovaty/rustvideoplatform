{% include "pages/hx-mediumlist.html" %}
{% if has_more %}
<div style="position:absolute;height:0;width:0;overflow:hidden;visibility:hidden;" hx-get="{{ next_url }}" hx-trigger="revealed" hx-target="#inf-scroll-hist-{{ page }}" hx-swap="outerHTML" data-remove-after-request></div>
<div id="inf-scroll-hist-{{ page }}" class="col-12 my-4 inf-scroll-placeholder"></div>
{% else %}
<div class="col-12 text-center my-4">
    {% if media.is_empty() && page == 0 %}
    <p class="text-secondary">{{ locale.t("history-empty") }}</p>
    {% else %}
    <p class="text-secondary"><i class="fa-solid fa-circle-check me-2"></i>{{ locale.t("pagination-end") }}</p>
    {% endif %}
</div>
{% endif %}
