<!DOCTYPE html>
<html lang="{{ resolved_lang }}">

<head>
    {% include "component-dependencies.html" %}

    <title>{{ locale.t("search-page-title") }} - {{ config.instancename }}</title>

    <meta name="description" content="{{ config.description }}" />
    <meta property="og:title" content="{{ config.instancename }} Search" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{ config.site_url }}/search" />
    <meta property="og:locale" content="{{ resolved_lang }}" />
    <meta property="og:description" content="{{ config.description }}" />
    <meta property="og:image" content="{{ config.source_server_url }}/source/favicon.svg" />
    <meta property="og:site_name" content="{{ config.instancename }}" />
    <script type="application/ld+json">{{ schema_org_json }}</script>
</head>

<body hx-ext="preload">
    {% set page_title = locale.t("search-page-title") %}
    {{ sidebar }}
    {% include "component-navbar.html" %}
    <div class="row maincontentrow g-3 py-2 ps-2 w-100" role="main">
        <div class="col-12">
            <div class="card py-3 px-3 text-white" style="min-height: 80vh;">

                <div class="search-header">
                    <div class="search-bar-wrapper">
                        <form id="searchForm" hx-post="/hx/search/0" hx-target="#searchresults" hx-trigger="submit"
                            hx-indicator="#search-loading" role="search" aria-label="Advanced search">
                            <div class="search-input-group">
                                <input class="search-main-input" id="searchMainInput" name="search"
                                    placeholder="{{ locale.t("search-input-placeholder") }}"
                                    value="{{ initial_query }}" autocomplete="off" aria-label="Search query" />
                                <button type="submit" class="search-submit-btn" aria-label="Submit search">
                                    <i class="fa-solid fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                                </button>
                            </div>

                            <div class="search-filters">
                                <div class="filter-group">
                                    <label class="filter-label"><i class="fa-solid fa-compass me-1"></i>{{ locale.t("search-filter-search-in") }}</label>
                                    <div class="filter-chips" id="searchInFilter">
                                        <button type="button" class="filter-chip active" data-value="all"><i class="fa-solid fa-magnifying-glass me-1"></i>{{ locale.t("search-filter-all") }}</button>
                                        <button type="button" class="filter-chip" data-value="media"><i class="fa-solid fa-photo-film me-1"></i>{{ locale.t("search-filter-media") }}</button>
                                        <button type="button" class="filter-chip" data-value="lists"><i class="fa-solid fa-list me-1"></i>{{ locale.t("search-filter-lists") }}</button>
                                        <button type="button" class="filter-chip" data-value="users"><i class="fa-solid fa-users me-1"></i>{{ locale.t("search-filter-users") }}</button>
                                    </div>
                                    <input type="hidden" name="search_in" id="searchInInput" value="all" />
                                </div>

                                <div id="mediaSpecificFilters" style="display:none;">
                                    <div class="filter-group mb-1">
                                        <label class="filter-label"><i class="fa-solid fa-photo-film me-1"></i>{{ locale.t("search-filter-type") }}</label>
                                        <div class="filter-chips" id="typeFilter">
                                            <button type="button" class="filter-chip active" data-value="">{{ locale.t("search-filter-all") }}</button>
                                            <button type="button" class="filter-chip" data-value="video"><i class="fa-solid fa-video me-1"></i>{{ locale.t("search-filter-video") }}</button>
                                            <button type="button" class="filter-chip" data-value="audio"><i class="fa-solid fa-music me-1"></i>{{ locale.t("search-filter-audio") }}</button>
                                            <button type="button" class="filter-chip" data-value="picture"><i class="fa-solid fa-image me-1"></i>{{ locale.t("search-filter-picture") }}</button>
                                        </div>
                                        <input type="hidden" name="media_type" id="mediaTypeInput" value="" />
                                    </div>

                                    <div class="filter-group mb-1">
                                        <label class="filter-label"><i class="fa-solid fa-arrow-down-wide-short me-1"></i>{{ locale.t("search-filter-sort") }}</label>
                                        <div class="filter-chips" id="sortFilter">
                                            <button type="button" class="filter-chip active" data-value=""><i class="fa-solid fa-star me-1"></i>{{ locale.t("search-sort-relevance") }}</button>
                                            <button type="button" class="filter-chip" data-value="newest"><i class="fa-solid fa-clock me-1"></i>{{ locale.t("search-sort-newest") }}</button>
                                            <button type="button" class="filter-chip" data-value="oldest"><i class="fa-solid fa-clock-rotate-left me-1"></i>{{ locale.t("search-sort-oldest") }}</button>
                                            <button type="button" class="filter-chip" data-value="views"><i class="fa-solid fa-eye me-1"></i>{{ locale.t("search-sort-most-viewed") }}</button>
                                            <button type="button" class="filter-chip" data-value="likes"><i class="fa-solid fa-heart me-1"></i>{{ locale.t("search-sort-most-liked") }}</button>
                                        </div>
                                        <input type="hidden" name="sort_by" id="sortByInput" value="" />
                                    </div>

                                    <div class="filter-group mb-1">
                                        <label class="filter-label"><i class="fa-solid fa-calendar me-1"></i>{{ locale.t("search-filter-date") }}</label>
                                        <div class="filter-chips" id="dateFilter">
                                            <button type="button" class="filter-chip active" data-value="">{{ locale.t("search-date-anytime") }}</button>
                                            <button type="button" class="filter-chip" data-value="today">{{ locale.t("search-date-today") }}</button>
                                            <button type="button" class="filter-chip" data-value="week">{{ locale.t("search-date-week") }}</button>
                                            <button type="button" class="filter-chip" data-value="month">{{ locale.t("search-date-month") }}</button>
                                            <button type="button" class="filter-chip" data-value="year">{{ locale.t("search-date-year") }}</button>
                                        </div>
                                        <input type="hidden" name="date_range" id="dateRangeInput" value="" />
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>

                <div id="search-loading" class="search-loading htmx-indicator">
                    <div class="search-loading-bar"></div>
                </div>

                <div id="searchresults" class="search-results-grid">
                </div>

            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        // Filter chip click handlers
        document.querySelectorAll('.filter-chips').forEach(function(group) {
            group.querySelectorAll('.filter-chip').forEach(function(chip) {
                chip.addEventListener('click', function() {
                    group.querySelectorAll('.filter-chip').forEach(function(c) { c.classList.remove('active'); });
                    chip.classList.add('active');

                    // Update the hidden input
                    var hiddenInput = group.nextElementSibling;
                    if (hiddenInput) {
                        hiddenInput.value = chip.getAttribute('data-value');
                    }

                    // Show/hide media-specific filters based on search_in
                    if (group.id === 'searchInFilter') {
                        var mediaFilters = document.getElementById('mediaSpecificFilters');
                        var val = chip.getAttribute('data-value');
                        if (val === 'media') {
                            mediaFilters.style.display = '';
                        } else {
                            mediaFilters.style.display = 'none';
                        }
                    }

                    // Auto-submit if there's a search query
                    var searchInput = document.getElementById('searchMainInput');
                    if (searchInput && searchInput.value.trim().length > 0) {
                        htmx.trigger('#searchForm', 'submit');
                    }
                });
            });
        });

        // Submit on Enter key in search input
        var searchInput = document.getElementById('searchMainInput');
        if (searchInput) {
            searchInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    htmx.trigger('#searchForm', 'submit');
                }
            });

            // Auto-search on typing with debounce
            var debounceTimer;
            searchInput.addEventListener('input', function() {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(function() {
                    if (searchInput.value.trim().length > 0) {
                        htmx.trigger('#searchForm', 'submit');
                    }
                }, 400);
            });

            // Auto-trigger search if initial query present
            if (searchInput.value.trim().length > 0) {
                setTimeout(function() { htmx.trigger('#searchForm', 'submit'); }, 100);
            }

            searchInput.focus();
        }

        // "See all" buttons in combined results switch to specific tab
        document.addEventListener('click', function(e) {
            var btn = e.target.closest('.search-see-all-btn');
            if (!btn) return;
            var searchIn = btn.getAttribute('data-search-in');
            var filterGroup = document.getElementById('searchInFilter');
            if (filterGroup) {
                filterGroup.querySelectorAll('.filter-chip').forEach(function(c) { c.classList.remove('active'); });
                var target = filterGroup.querySelector('[data-value="' + searchIn + '"]');
                if (target) {
                    target.classList.add('active');
                }
            }
            var hiddenInput = document.getElementById('searchInInput');
            if (hiddenInput) hiddenInput.value = searchIn;
            var mediaFilters = document.getElementById('mediaSpecificFilters');
            if (mediaFilters) {
                mediaFilters.style.display = (searchIn === 'media') ? '' : 'none';
            }
            var si = document.getElementById('searchMainInput');
            if (si && si.value.trim().length > 0) {
                htmx.trigger('#searchForm', 'submit');
            }
        });
    });
    </script>
</body>

</html>
