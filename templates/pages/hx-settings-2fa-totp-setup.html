<div class="mt-2 p-3 border border-secondary rounded">
    <h6><i class="fa-solid fa-qrcode me-2"></i>{{ locale.t("totp-setup-qr-heading") }}</h6>
    <p class="text-muted small">{{ locale.t("totp-setup-qr-instruction") }}</p>

    <div class="text-center mb-3">
        <img src="data:image/png;base64,{{ qr_base64 }}" alt="TOTP QR Code" style="max-width:220px; border-radius:8px;">
    </div>

    <details class="mb-3">
        <summary class="text-muted small" style="cursor:pointer;">{{ locale.t("totp-setup-show-manual") }}</summary>
        <code class="d-block mt-1 p-2 bg-dark rounded" style="word-break:break-all;letter-spacing:2px;">{{ secret_base32 }}</code>
    </details>

    <hr>
    <h6>{{ locale.t("totp-setup-verify-heading") }}</h6>
    <p class="text-muted small">{{ locale.t("totp-setup-verify-instruction") }}</p>
    <form hx-post="/hx/settings/2fa/totp/verify-setup" hx-target="#totp-setup-area" hx-swap="innerHTML">
        <input type="hidden" name="setup_token" value="{{ setup_token }}">
        <div class="d-flex gap-2">
            <input class="form-control text-center" type="text" name="totp_code"
                   placeholder="{{ locale.t("totp-code-placeholder") }}" maxlength="6" pattern="[0-9]{6}"
                   inputmode="numeric" autocomplete="one-time-code" style="max-width:140px;">
            <button type="submit" class="btn btn-success">
                <i class="fa-solid fa-check me-1"></i>{{ locale.t("totp-setup-confirm") }}
            </button>
        </div>
    </form>
</div>
