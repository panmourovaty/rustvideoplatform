services:
 rustapp:
   image: panmourovaty/rustvideoplatform
   ports:
    - "8080:8080"
   deploy:
     resources:
       limits:
         memory: 2G
   volumes:
     - ./source:/source
     - ./upload:/upload
     - ./config.json:/config.json
   depends_on:
     - postgres
     - dragonfly
 dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./dragonfly-data:/data
    ulimits:
      memlock: -1
 postgres:
    image: postgres:18-alpine
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=YOURPASSWORD
      - POSTGRES_USER=vids
      - POSTGRES_DB=vids
